<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#14243b"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="320" fill="url(#bgCar)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
  </g>

  <!-- Highway Road Perspective -->
  <polygon points="180,320 250,80 350,80 420,320" fill="url(#roadGrad)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2"/>
  
  <!-- Dashed Center Lane -->
  <line x1="300" y1="90" x2="300" y2="130" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="300" y1="160" x2="300" y2="215" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <line x1="300" y1="250" x2="300" y2="320" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>

  <!-- Player Sports Car -->
  <g transform="translate(265, 200)">
    <!-- Car shadow -->
    <ellipse cx="35" cy="80" rx="36" ry="10" fill="rgba(0,0,0,0.6)"/>
    <!-- Body -->
    <rect x="12" y="10" width="46" height="70" rx="10" fill="#10b981"/>
    <!-- Roof & Windshield -->
    <rect x="18" y="26" width="34" height="30" rx="6" fill="#064e3b"/>
    <rect x="22" y="32" width="26" height="18" rx="4" fill="#6ee7b7" opacity="0.9"/>
    <!-- Headlights -->
    <rect x="15" y="12" width="8" height="6" rx="2" fill="#fef08a"/>
    <rect x="47" y="12" width="8" height="6" rx="2" fill="#fef08a"/>
    <!-- Taillights -->
    <rect x="15" y="74" width="8" height="4" rx="1" fill="#ef4444"/>
    <rect x="47" y="74" width="8" height="4" rx="1" fill="#ef4444"/>
    <!-- Wheels -->
    <rect x="6" y="20" width="6" height="14" rx="2" fill="#0f172a"/>
    <rect x="58" y="20" width="6" height="14" rx="2" fill="#0f172a"/>
    <rect x="6" y="55" width="6" height="14" rx="2" fill="#0f172a"/>
    <rect x="58" y="55" width="6" height="14" rx="2" fill="#0f172a"/>
  </g>

  <!-- Obstacle Car Ahead -->
  <g transform="translate(320, 110)">
    <rect x="6" y="4" width="28" height="42" rx="6" fill="#ef4444"/>
    <rect x="10" y="14" width="20" height="18" rx="3" fill="#450a0a"/>
    <rect x="12" y="18" width="16" height="10" rx="2" fill="#fca5a5"/>
    <rect x="8" y="42" width="6" height="3" fill="#fef08a"/>
    <rect x="26" y="42" width="6" height="3" fill="#fef08a"/>
  </g>

  <!-- Speedometer HUD overlay -->
  <g transform="translate(40, 50)">
    <rect width="130" height="65" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <text x="14" y="28" fill="#94a3b8" font-family="monospace" font-size="11">SPEED (KM/H)</text>
    <text x="14" y="54" fill="#34d399" font-family="monospace" font-size="22" font-weight="bold">142</text>
  </g>

  <!-- Score HUD overlay -->
  <g transform="translate(430, 50)">
    <rect width="130" height="65" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <text x="14" y="28" fill="#94a3b8" font-family="monospace" font-size="11">SCORE</text>
    <text x="14" y="54" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="bold">04,850</text>
  </g>
</svg>
